<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #D9000F;
    --red-dark: #a80009;
    --red-light: #ff1a28;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --black: #ffffff;      /* Changed to white for light theme */
    --near-black: #f9f9f9; /* Soft light gray */
    --dark: #ffffff;       /* White for cards */
    --mid: #f0f0f0;        /* Medium-light gray borders/accents */
    --gray: #666666;
    --light-gray: #cccccc;
    --off-white: #111111;
    --white: #0a0a0a;      /* Changed to almost black for text */
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'DM Sans', sans-serif;
  }

  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font-body);
    background: var(--black);
    color: var(--white);
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* ── NAVBAR ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 0 5%;
    display: flex; align-items: center; justify-content: space-between;
    height: 72px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(217, 0, 15, 0.15);
  }
  .logo-wrap { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .logo-icon {
    width: 42px; height: 42px; background: var(--red);
    display: flex; align-items: center; justify-content: center;
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    flex-shrink: 0;
  }
  .logo-icon svg { width: 22px; height: 22px; fill: white; }
  .logo-text { display: flex; flex-direction: column; line-height: 1.1; }
  .logo-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--white); letter-spacing: 0.02em; }
  .logo-sub { font-size: 9px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
  .nav-cta {
    background: var(--red); color: white;
    padding: 10px 24px; border: none; cursor: pointer;
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase;
    text-decoration: none;
    clip-path: polygon(8px 0%, 100% 0%, calc(100% - 8px) 100%, 0% 100%);
    transition: background 0.2s;
  }
  .nav-cta:hover { background: var(--red-dark); }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: grid; grid-template-columns: 1fr 1fr;
    padding-top: 72px;
    position: relative; overflow: hidden;
  }
  .hero-bg-pattern {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      repeating-linear-gradient(45deg, rgba(217,0,15,0.03) 0px, rgba(217,0,15,0.03) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(-45deg, rgba(217,0,15,0.03) 0px, rgba(217,0,15,0.03) 1px, transparent 1px, transparent 40px);
  }
  .hero-accent-line {
    position: absolute; left: 0; top: 72px; bottom: 0; width: 4px;
    background: linear-gradient(to bottom, var(--red), transparent);
  }
  .hero-left {
    padding: 80px 5% 80px 7%;
    display: flex; flex-direction: column; justify-content: center;
    position: relative; z-index: 2;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(217,0,15,0.08); border: 1px solid rgba(217,0,15,0.25);
    padding: 6px 14px; border-radius: 2px; margin-bottom: 28px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--red); width: fit-content;
  }
  .hero-badge::before { content: ''; width: 6px; height: 6px; background: var(--red); border-radius: 50%; }
  .hero-h1 {
    font-family: var(--font-display);
    font-size: clamp(42px, 5.5vw, 74px);
    font-weight: 700; line-height: 1.05;
    color: var(--white); margin-bottom: 8px;
  }
  .hero-h1 em {
    font-style: italic; color: var(--gold);
  }
  .hero-h1-sub {
    font-family: var(--font-display);
    font-size: clamp(28px, 3.5vw, 48px);
    font-weight: 400; font-style: italic;
    color: rgba(0, 0, 0, 0.55); margin-bottom: 32px;
  }
  .hero-desc {
    font-size: 16px; color: rgba(0, 0, 0, 0.65);
    max-width: 460px; line-height: 1.7; margin-bottom: 40px;
    font-weight: 400;
  }
  .hero-ctas { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 52px; }
  .btn-primary {
    background: var(--red); color: white;
    padding: 16px 36px; border: none; cursor: pointer;
    font-family: var(--font-body); font-size: 14px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none;
    display: inline-block;
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
    transition: all 0.2s;
    position: relative; overflow: hidden;
  }
  .btn-primary::after {
    content: ''; position: absolute; inset: 0;
    background: rgba(0, 0, 0, 0.05);
    transform: translateX(-100%); transition: transform 0.3s;
  }
  .btn-primary:hover { background: var(--red-dark); }
  .btn-primary:hover::after { transform: translateX(0); }
  .btn-ghost {
    color: rgba(0, 0, 0, 0.75); font-size: 14px; font-weight: 600;
    text-decoration: none; display: flex; align-items: center; gap: 8px;
    letter-spacing: 0.04em; transition: color 0.2s, border-color 0.2s;
    border: 1px solid rgba(0, 0, 0, 0.2);
    padding: 15px 28px;
  }
  .btn-ghost:hover { color: var(--white); border-color: rgba(0, 0, 0, 0.5); }
  .btn-ghost svg { width: 16px; height: 16px; }

  .hero-stats {
    display: flex; gap: 36px; flex-wrap: wrap;
    border-top: 1px solid rgba(0, 0, 0, 0.1);
    padding-top: 28px;
  }
  .stat { }
  .stat-num {
    font-family: var(--font-display); font-size: 34px; font-weight: 700;
    color: var(--white); line-height: 1;
  }
  .stat-num span { color: var(--red); }
  .stat-label { font-size: 12px; color: rgba(0, 0, 0, 0.5); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 4px; font-weight: 600; }

  /* Hero right — visual mosaic */
  .hero-right {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 80px 4% 80px 0;
  }
  .hero-mosaic {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto auto;
    gap: 10px;
    width: 100%; max-width: 500px;
    position: relative; z-index: 2;
  }
  .mosaic-card {
    border-radius: 4px; overflow: hidden;
    position: relative; background: var(--mid);
    transition: transform 0.3s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  }
  .mosaic-card:hover { transform: scale(1.02); }
  .mosaic-card.tall { grid-row: span 2; }
  .mosaic-card img {
    width: 100%; height: 100%; object-fit: cover;
    display: block; min-height: 180px;
    filter: brightness(0.95) saturate(1.1);
    transition: filter 0.4s;
  }
  .mosaic-card:hover img { filter: brightness(1) saturate(1.2); }
  .mosaic-card .card-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(255, 255, 255, 0.95) 0%, transparent 50%);
  }
  .mosaic-card .card-label {
    position: absolute; bottom: 10px; left: 12px; right: 12px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(0, 0, 0, 0.85);
  }
  .mosaic-badge-floating {
    position: absolute; top: -16px; right: -16px; z-index: 10;
    width: 100px; height: 100px;
    background: var(--red); color: white;
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 0 30px rgba(217,0,15,0.3);
    animation: pulse-badge 3s ease-in-out infinite;
  }
  .mosaic-badge-floating .badge-num { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1; }
  .mosaic-badge-floating .badge-txt { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; line-height: 1.3; opacity: 0.9; }
  @keyframes pulse-badge { 0%,100%{box-shadow:0 0 30px rgba(217,0,15,0.3)} 50%{box-shadow:0 0 50px rgba(217,0,15,0.5)} }

  /* SVG Trophy Illustrations */
  .trophy-svg { width: 100%; height: 100%; min-height: 180px; display: block; }

  /* ── TRUST BAR ── */
  .trust-bar {
    background: rgba(217,0,15,0.03);
    border-top: 1px solid rgba(217,0,15,0.1);
    border-bottom: 1px solid rgba(217,0,15,0.1);
    padding: 20px 5%;
    display: flex; align-items: center; justify-content: center;
    gap: 48px; flex-wrap: wrap;
  }
  .trust-item {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 600; color: rgba(0, 0, 0, 0.7);
    white-space: nowrap;
  }
  .trust-item svg { width: 18px; height: 18px; fill: var(--gold); flex-shrink: 0; }
  .trust-divider { width: 1px; height: 28px; background: rgba(0, 0, 0, 0.1); }

  /* ── SECTIONS ── */
  section { padding: 100px 5%; }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--red);
    margin-bottom: 14px; display: flex; align-items: center; gap: 10px;
  }
  .section-label::before { content: ''; width: 32px; height: 1px; background: var(--red); }
  .section-h2 {
    font-family: var(--font-display);
    font-size: clamp(34px, 4vw, 54px);
    font-weight: 700; line-height: 1.1; color: var(--white);
  }
  .section-h2 em { font-style: italic; color: var(--gold); }

  /* ── PRODUCTS GRID ── */
  .products-section { background: var(--near-black); }
  .products-header { max-width: 640px; margin-bottom: 60px; }
  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .product-card {
    background: var(--dark);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
    cursor: pointer;
  }
  .product-card:hover { 
    border-color: rgba(217,0,15,0.4); 
    transform: translateY(-4px); 
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  }
  .product-card-img {
    height: 240px; overflow: hidden; position: relative;
    background: linear-gradient(135deg, #1e1e1e, #2a2a2a);
    display: flex; align-items: center; justify-content: center;
  }
  .product-card-img svg { width: 60%; height: 60%; }
  .product-card-tag {
    position: absolute; top: 12px; left: 12px;
    background: var(--red); color: white;
    font-size: 10px; font-weight: 700; letter-spacing: 0.15em;
    text-transform: uppercase; padding: 4px 10px;
  }
  .product-card-body { padding: 22px 22px 26px; }
  .product-card-name {
    font-family: var(--font-display); font-size: 22px; font-weight: 700;
    color: var(--white); margin-bottom: 8px; line-height: 1.2;
  }
  .product-card-desc { font-size: 14px; color: rgba(0, 0, 0, 0.6); line-height: 1.65; margin-bottom: 18px; }
  .product-card-link {
    font-size: 12px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--gold);
    text-decoration: none; display: flex; align-items: center; gap: 6px;
    transition: gap 0.2s;
  }
  .product-card:hover .product-card-link { gap: 10px; }

  /* ── USP SECTION ── */
  .usp-section {
    background: var(--black);
    position: relative; overflow: hidden;
  }
  .usp-section::before {
    content: 'EXCELLENCE';
    position: absolute; right: -40px; top: 50%;
    transform: translateY(-50%);
    font-family: var(--font-display); font-size: 180px; font-weight: 700;
    color: rgba(217,0,15,0.03); pointer-events: none; white-space: nowrap;
  }
  .usp-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 60px; align-items: center;
  }
  .usp-list { display: flex; flex-direction: column; gap: 0; }
  .usp-item {
    display: flex; gap: 24px; align-items: flex-start;
    padding: 28px 0;
    border-bottom: 1px solid rgba(0, 0, 0, 0.07);
    transition: padding-left 0.3s;
    cursor: default;
  }
  .usp-item:hover { padding-left: 10px; }
  .usp-item:first-child { border-top: 1px solid rgba(0, 0, 0, 0.07); }
  .usp-number {
    font-family: var(--font-display); font-size: 44px; font-weight: 700;
    color: rgba(217,0,15,0.15); line-height: 1; min-width: 52px;
    transition: color 0.3s;
  }
  .usp-item:hover .usp-number { color: var(--red); }
  .usp-content { }
  .usp-title { font-size: 17px; font-weight: 700; color: var(--white); margin-bottom: 6px; }
  .usp-desc { font-size: 14px; color: rgba(0, 0, 0, 0.6); line-height: 1.65; }
  .usp-visual {
    display: flex; flex-direction: column; gap: 16px; position: relative;
  }
  .usp-visual-main {
    background: var(--dark);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 4px; overflow: hidden;
    aspect-ratio: 4/3;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }
  .usp-visual-main svg { width: 55%; height: 55%; }
  .usp-visual-secondary {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  .usp-mini-card {
    background: var(--dark);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 4px; padding: 20px 18px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }
  .usp-mini-num {
    font-family: var(--font-display); font-size: 32px; font-weight: 700;
    color: var(--gold); line-height: 1;
  }
  .usp-mini-label { font-size: 11px; color: rgba(0, 0, 0, 0.5); text-transform: uppercase; letter-spacing: 0.12em; margin-top: 4px; font-weight: 600;}

  /* ── HOW IT WORKS ── */
  .how-section { background: var(--near-black); }
  .steps-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 0; margin-top: 60px; position: relative;
  }
  .steps-grid::before {
    content: '';
    position: absolute; top: 36px; left: 12.5%; right: 12.5%;
    height: 1px; background: linear-gradient(to right, transparent, var(--red), transparent);
  }
  .step { padding: 0 24px 0 0; text-align: left; }
  .step-circle {
    width: 72px; height: 72px;
    border: 2px solid var(--red);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px; position: relative; background: var(--dark);
    font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--red);
  }
  .step-circle svg { width: 28px; height: 28px; fill: none; stroke: var(--red); stroke-width: 1.5; }
  .step-title { font-size: 16px; font-weight: 700; color: var(--white); margin-bottom: 8px; }
  .step-desc { font-size: 14px; color: rgba(0, 0, 0, 0.6); line-height: 1.65; }

  /* ── INDUSTRIES ── */
  .industries-section { background: var(--black); }
  .industries-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 14px; margin-top: 52px;
  }
  .industry-pill {
    background: var(--dark);
    border: 1px solid rgba(0, 0, 0, 0.08);
    padding: 18px 22px;
    border-radius: 2px;
    display: flex; align-items: center; gap: 14px;
    font-size: 14px; font-weight: 600; color: rgba(0, 0, 0, 0.7);
    transition: all 0.25s; cursor: default;
  }
  .industry-pill:hover {
    border-color: rgba(217,0,15,0.3);
    background: rgba(217,0,15,0.04);
    color: var(--white);
  }
  .industry-pill svg { width: 20px; height: 20px; fill: none; stroke: var(--red); stroke-width: 1.5; flex-shrink: 0; }

  /* ── TESTIMONIALS ── */
  .testimonials-section { background: var(--near-black); }
  .testi-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-top: 52px; }
  .testi-card {
    background: var(--dark);
    border: 1px solid rgba(0, 0, 0, 0.07);
    border-radius: 4px; padding: 30px 28px;
    position: relative; transition: border-color 0.3s, box-shadow 0.3s;
  }
  .testi-card:hover { border-color: rgba(201,168,76,0.6); box-shadow: 0 10px 30px rgba(0,0,0,0.04); }
  .testi-quote {
    font-family: var(--font-display); font-size: 60px; font-weight: 700;
    color: rgba(217,0,15,0.1); line-height: 0.6; margin-bottom: 18px;
  }
  .testi-text {
    font-size: 15px; color: rgba(0, 0, 0, 0.75); line-height: 1.7;
    font-style: italic; margin-bottom: 24px;
    font-family: var(--font-display); font-weight: 600;
  }
  .testi-author { display: flex; align-items: center; gap: 12px; }
  .testi-avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--mid); display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--gold);
    flex-shrink: 0;
  }
  .testi-name { font-size: 14px; font-weight: 700; color: var(--white); }
  .testi-company { font-size: 12px; color: rgba(0, 0, 0, 0.5); margin-top: 2px; }
  .stars { display: flex; gap: 2px; margin-bottom: 14px; }
  .star { color: var(--gold); font-size: 14px; }

  /* ── LEAD FORM ── */
  .form-section {
    background: var(--black);
    position: relative; overflow: hidden;
  }
  .form-section::after {
    content: '';
    position: absolute; bottom: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(217,0,15,0.06) 0%, transparent 70%);
    pointer-events: none;
  }
  .form-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 80px; align-items: center; position: relative; z-index: 2;
  }
  .form-left { }
  .form-promise-list { margin-top: 36px; display: flex; flex-direction: column; gap: 14px; }
  .form-promise {
    display: flex; align-items: flex-start; gap: 12px;
    font-size: 15px; color: rgba(0, 0, 0, 0.7); font-weight: 500;
  }
  .form-promise-icon {
    width: 22px; height: 22px; background: rgba(217,0,15,0.08);
    border: 1px solid rgba(217,0,15,0.3);
    display: flex; align-items: center; justify-content: center;
    border-radius: 2px; flex-shrink: 0; margin-top: 2px;
  }
  .form-promise-icon svg { width: 12px; height: 12px; stroke: var(--red); stroke-width: 2; fill: none; }
  .form-right {
    background: var(--dark);
    border: 1px solid rgba(0, 0, 0, 0.1);
    border-radius: 4px; padding: 42px 38px;
    border-top: 3px solid var(--red);
    box-shadow: 0 10px 40px rgba(0,0,0,0.04);
  }
  .form-title { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--white); margin-bottom: 6px; }
  .form-subtitle { font-size: 14px; color: rgba(0, 0, 0, 0.5); margin-bottom: 32px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { margin-bottom: 16px; }
  .form-group.full { grid-column: 1/-1; }
  label {
    display: block; font-size: 12px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(0, 0, 0, 0.6); margin-bottom: 8px;
  }
  input, select, textarea {
    width: 100%;
    background: rgba(0, 0, 0, 0.03);
    border: 1px solid rgba(0, 0, 0, 0.12);
    color: var(--white);
    padding: 13px 16px;
    font-family: var(--font-body); font-size: 14px;
    border-radius: 2px;
    transition: border-color 0.2s, background 0.2s;
    outline: none;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--red);
    background: rgba(217,0,15,0.03);
  }
  input::placeholder, textarea::placeholder { color: rgba(0, 0, 0, 0.35); }
  select option { background: var(--dark); color: var(--white); }
  textarea { resize: vertical; min-height: 100px; }
  .form-submit {
    width: 100%;
    background: var(--red); color: white;
    padding: 18px 36px; border: none; cursor: pointer;
    font-family: var(--font-body); font-size: 14px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    margin-top: 8px;
    transition: background 0.2s, transform 0.1s;
    position: relative; overflow: hidden;
  }
  .form-submit:hover { background: var(--red-dark); }
  .form-submit:active { transform: scale(0.99); }
  .form-note { font-size: 12px; color: rgba(0, 0, 0, 0.4); text-align: center; margin-top: 12px; font-weight: 500;}

  /* ── FOOTER ── */
  footer {
    background: var(--near-black);
    border-top: 1px solid rgba(217,0,15,0.1);
    padding: 48px 5% 32px;
  }
  .footer-inner {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
